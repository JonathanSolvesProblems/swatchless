name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json's packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Every stated number matches the data
        run: python -I scripts/check_claims.py
